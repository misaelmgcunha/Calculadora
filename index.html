<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imgs/logo.svg" type="image/svg">
    <script src="https://kit.fontawesome.com/e70338b9bd.js" crossorigin="anonymous"></script>
    <title>CalculaPro</title>
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-calculator txt-laranja"></i> Calcula<span class="txt-laranja">Pro</span></h1>
    </header>
    <main>
        <div id="visor"><p id="valor" class="txt-laranja">0</p></div>
        <div id="botoes">
            <button class="botao txt-branco">C</button>
            <button class="botao txt-branco"><i class="fa-solid fa-delete-left"></i></button>
            <button class="botao txt-branco">&percnt;</button>
            <button class="botao txt-laranja">&divide;</button>
            <button class="botao txt-branco">7</button>
            <button class="botao txt-branco">8</button>
            <button class="botao txt-branco">9</button>
            <button class="botao txt-laranja"><i class="fa-solid fa-xmark"></i></button>
            <button class="botao txt-branco">4</button>
            <button class="botao txt-branco">5</button>
            <button class="botao txt-branco">6</button>
            <button class="botao txt-laranja">-</button>
            <button class="botao txt-branco">1</button>
            <button class="botao txt-branco">2</button>
            <button class="botao txt-branco">3</button>
            <button class="botao txt-laranja">+</button>
            <button class="botao txt-branco">0</button>
            <button class="botao txt-branco">,</button>
            <button class="botao" id="b-igual">=</button>
        </div>
    </main>
    <footer>
        <p>Site fictício feito por <a href="https://misaelmgcunha.github.io/" rel="nofollow" target="_blank">Misael Cunha</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
